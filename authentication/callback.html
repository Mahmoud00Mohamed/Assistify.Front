<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character Encoding and Viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Core Metadata -->
    <title>Secure Authentication | Assistify</title>
    <meta
      name="description"
      content="Authenticate securely to access your Assistify account and manage your tasks and projects."
    />
    <meta
      name="keywords"
      content="secure authentication, Assistify login, account security, task management"
    />
    <meta name="author" content="Assistify" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://www.assistify.site/authenticate" />

    <!-- Open Graph Metadata (Social Media Sharing) -->
    <meta property="og:title" content="Secure Authentication | Assistify" />
    <meta
      property="og:description"
      content="Complete secure authentication to access your Assistify account and its task management features."
    />
    <meta
      property="og:image"
      content="https://www.assistify.site/photo/logo.png"
    />
    <meta property="og:url" content="https://www.assistify.site/authenticate" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Secure Authentication | Assistify" />
    <meta
      name="twitter:description"
      content="Authenticate securely to unlock your Assistify account and manage tasks efficiently."
    />
    <meta
      name="twitter:image"
      content="https://www.assistify.site/photo/logo.png"
    />

    <!-- Favicons -->
    <link rel="shortcut icon" href="/photo/logo.png" type="image/x-icon" />
    <link rel="icon" type="image/png" sizes="192x192" href="/photo/logo.png" />

    <!-- Inline Styles -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(145deg, #0a0e1a, #1a2338);
        overflow: hidden;
        font-family: Inter, sans-serif;
      }
      .auth-wrapper {
        position: relative;
        width: 100%;
        max-width: 420px;
        padding: 40px;
        background: rgba(20, 30, 48, 0.85);
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        text-align: center;
        color: #d1d5db;
        animation: fadeInScale 0.6s ease-out;
        transition: all 0.4s ease;
      }
      .auth-wrapper.success {
        background: rgba(34, 197, 94, 0.1);
        border-color: rgba(34, 197, 94, 0.3);
        box-shadow: 0 20px 40px rgba(34, 197, 94, 0.2);
      }
      .auth-wrapper::before {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: 18px;
        background: linear-gradient(120deg, #3b82f6, #10b981, #8b5cf6);
        opacity: 0.6;
        z-index: -1;
        animation: borderGlow 10s linear infinite;
      }
      .auth-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 25px;
      }
      .auth-icon {
        width: 70px;
        height: 70px;
        background: linear-gradient(135deg, #3b82f6, #60a5fa);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 25px rgba(59, 130, 246, 0.4);
        transition: all 0.5s ease;
      }
      .auth-icon.success {
        background: linear-gradient(135deg, #22c55e, #4ade80);
        box-shadow: 0 0 25px rgba(34, 197, 94, 0.4);
      }
      .auth-icon::after {
        content: "🔐";
        font-size: 32px;
      }
      .auth-icon.success::after {
        content: "✓";
        font-size: 40px;
        color: #fff;
      }
      h2 {
        font-size: 26px;
        font-weight: 600;
        margin-top: 15px;
        color: #e5e7eb;
        transition: all 0.5s ease;
      }
      h2.success {
        color: #22c55e;
      }
      p {
        font-size: 16px;
        line-height: 1.5;
        color: #9ca3af;
        transition: all 0.5s ease;
      }
      p.success {
        color: #d1d5db;
      }
      .auth-progress {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 3px;
        margin-top: 25px;
        overflow: hidden;
        transition: opacity 0.3s ease;
      }
      .auth-progress::after {
        content: "";
        display: block;
        width: 0;
        height: 100%;
        background: linear-gradient(90deg, #3b82f6, #60a5fa);
        animation: progressFill 2s ease-in-out forwards;
      }
      .auth-progress.hidden {
        opacity: 0;
      }
      @keyframes fadeInScale {
        0% {
          opacity: 0;
          transform: scale(0.95);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes borderGlow {
        0% {
          background-position: 0 50%;
        }
        100% {
          background-position: 300% 50%;
        }
      }
      @keyframes progressFill {
        0% {
          width: 0;
        }
        100% {
          width: 100%;
        }
      }
      @media (max-width: 480px) {
        .auth-wrapper {
          max-width: 320px;
          padding: 25px;
        }
        h2 {
          font-size: 22px;
        }
        p {
          font-size: 14px;
        }
        .auth-icon {
          width: 60px;
          height: 60px;
        }
        .auth-icon::after {
          font-size: 28px;
        }
        .auth-icon.success::after {
          font-size: 34px;
        }
      }
    </style>
  </head>
  <body>
    <div class="auth-wrapper" id="authWrapper">
      <div class="auth-header">
        <div class="auth-icon" id="authIcon"></div>
        <h2 id="authTitle">Secure Authentication</h2>
      </div>
      <p id="authMessage">Verifying your credentials securely...</p>
      <div class="auth-progress" id="authProgress"></div>
    </div>
    <script src="/authentication/js/callback.js"></script>
  </body>
</html>
