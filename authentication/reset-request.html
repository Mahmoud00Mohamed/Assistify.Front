<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Assistify | Request Password Reset</title>
    <meta
      name="description"
      content="Forgot your password? Request a password reset for your Assistify account and regain access securely."
    />
    <meta
      name="keywords"
      content="reset request, forgot password, assistify password recovery, account access"
    />
    <meta name="author" content="Assistify" />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="Assistify | Request Password Reset" />
    <meta
      property="og:description"
      content="Easily request a password reset for your Assistify account and regain access securely."
    />
    <meta
      property="og:image"
      content="https://yourwebsite.com/photo/logo.png"
    />
    <meta property="og:url" content="https://yourwebsite.com/reset-request" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Assistify | Request Password Reset" />
    <meta
      name="twitter:description"
      content="Forgot your password? Request a reset and regain access to your Assistify account."
    />
    <meta
      name="twitter:image"
      content="https://yourwebsite.com/photo/logo.png"
    />
    <script src="/js/libs/tailwindcss.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="/Styles/libs/fonts-googleapis.css" />
    <link rel="icon" type="image/png" sizes="192x192" href="/photo/logo.png" />
    <link rel="shortcut icon" href="/photo/logo.png" type="image/x-icon" />
    <script src="https://www.google.com/recaptcha/api.js?render=6LczH98qAAAAACw9ZG4AoYNdYK9MOFsQQPPVDXzA"></script>
    <style>
      body {
        font-family: Inter, sans-serif;
      }
      .btn-primary {
        background-color: #3b82f6;
        color: #fff;
        border: none;
        padding: 12px 24px;
        border-radius: 50px;
        font-weight: 600;
        transition: all 0.3s ease;
      }
      .btn-primary:hover {
        background-color: #2563eb;
      }
      .btn-secondary {
        background-color: #e5e7eb;
        color: #111827;
        border: none;
        padding: 12px 24px;
        border-radius: 50px;
        font-weight: 600;
        transition: all 0.3s ease;
      }
      .btn-secondary:hover {
        background-color: #d1d5db;
      }
    </style>
  </head>
  <body class="bg-gradient-to-br from-gray-900 to-gray-800 text-gray-100">
    <nav
      class="navbar fixed w-full top-0 z-50 bg-gray-900 py-4 px-6 flex items-center justify-between"
    >
      <div class="container mx-auto flex items-center justify-between">
        <a href="../assistify.html" class="text-2xl font-bold text-blue-400"
          >Assistify</a
        >
        <div>
          <a
            href="./Login.html"
            class="px-4 py-2 text-sm font-semibold btn-primary rounded-lg hover:bg-blue-600 transition-all"
            >login</a
          >
        </div>
      </div>
    </nav>
    <div
      class="flex items-center justify-center min-h-screen pt-24 px-4 bg-gray-900"
    >
      <div
        class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700 mb-12"
      >
        <h2 class="text-3xl font-bold text-center mb-6 text-blue-400">
          Reset Your Password
        </h2>
        <p class="text-center text-gray-400 mb-6">
          Enter your email address and we’ll send you a link to reset your
          password.
        </p>
        <form id="reset-password-form">
          <div class="mb-6">
            <label class="block text-sm font-medium text-gray-400 mb-2"
              ><i class="fas fa-envelope mr-2 text-blue-400"></i> Email
              Address</label
            >
            <input
              type="email"
              id="email"
              class="w-full px-4 py-3 bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 border border-gray-600 placeholder-gray-400"
              placeholder="Enter your email"
              required
            />
          </div>
          <button
            type="submit"
            class="w-full btn-primary text-white font-semibold shadow-md"
          >
            Send Reset Link
          </button>
        </form>
        <div class="mt-6 text-center">
          <p class="text-sm text-gray-400">
            Remember your password?
            <a
              href="./login.html"
              class="text-blue-400 hover:underline transition"
              >Log in here</a
            >
          </p>
        </div>
      </div>
    </div>
    <script src="/js/libs/sweetalert2.js"></script>
    <script src="/authentication/js/Reset.js"></script>
    <script src="/js/main/auth.js"></script>
  </body>
</html>
