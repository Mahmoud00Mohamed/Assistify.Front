        font-weight: 600;
        transition: all 0.3s ease;
      }
      .btn-secondary:hover {
        background-color: #d1d5db;
      }

      rel="icon"

      sizes="192x192"

  <body class="bg-gradient-to-br from-gray-900 to-gray-800 text-gray-100">
    <nav class="navbar fixed w-full top-0 z-50 bg-transparent py-4 px-6">
      <div class="container mx-auto flex items-center justify-between">
        <a href="/index.html" class="text-2xl font-bold text-blue-400"
          >Assistify</a
        >
        <div>
          <a
            href="./Login.html"
            class="px-4 py-2 text-sm font-semibold btn-primary rounded-lg hover:bg-blue-600 transition-all"
            >login</a
          >
        </div>
      </div>
    </nav>
    <div
      class="flex items-center justify-center min-h-screen pt-24 px-4 bg-gray-900"
    >
      <div
        class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700"
      >
        <h2 class="text-3xl font-bold text-center mb-6 text-blue-400">
          Confirm Your Account
        </h2>
        <p class="text-center text-sm text-gray-400 mb-6">
          We have sent a verification code to your email address.
        </p>
        <form id="verification-form">
          <div class="mb-6">
            <label class="block text-sm font-medium text-gray-400 mb-2"
              ><i class="fas fa-key mr-2 text-blue-400"></i>Enter Verification
              Code</label
            >
            <input
              type="text"
              id="verification-code"
              class="w-full px-4 py-3 bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 border border-gray-600 placeholder-gray-400"
              placeholder="Enter the 6-digit code"
              required
            />
          </div>
          <button
            type="submit"
            class="w-full btn-primary text-white font-semibold shadow-md"
          >
            Verify Account
          </button>
        </form>
        <p class="text-center mt-4 text-sm">
          Didn't receive the code?
          <a
            href="#"
            onclick="resendVerificationCode()"
            class="text-blue-400 hover:underline transition"
            >Resend Code</a
          >
        </p>
        <p class="text-center mt-6 text-sm">
          Already verified?
          <a
            href="./login.html"
            class="text-blue-400 hover:underline transition"
            >Log in here</a
          >
        </p>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.7/dist/sweetalert2.all.min.js"></script>
    <script src="/authentication/js/Verify.js"></script>
    <script src="/js/main/auth.js"></script>
  </body>
