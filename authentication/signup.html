<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character Encoding and Viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Core Metadata -->
    <title>Sign Up | Assistify - Task & Project Management</title>
    <meta
      name="description"
      content="Create your free Assistify account today and start managing your tasks and projects with ease!"
    />
    <meta
      name="keywords"
      content="sign up, register, Assistify account, task management, project scheduling"
    />
    <meta name="author" content="Assistify" />
    <link rel="canonical" href="https://www.assistify.site/signup" />

    <!-- Open Graph Metadata (Social Media Sharing) -->
    <meta property="og:title" content="Sign Up for Assistify" />
    <meta
      property="og:description"
      content="Create your Assistify account and streamline your workflow with powerful task and project management tools."
    />
    <meta
      property="og:image"
      content="https://www.assistify.site/photo/logo.webp"
    />
    <meta property="og:url" content="https://www.assistify.site/signup" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sign Up for Assistify" />
    <meta
      name="twitter:description"
      content="Join Assistify and take control of your tasks and projects with ease."
    />
    <meta
      name="twitter:image"
      content="https://www.assistify.site/photo/logo.webp"
    />

    <!-- Stylesheets -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="/Styles/libs/fonts-googleapis.css" />

    <!-- Inline Styles -->
    <style>
      body {
        font-family: Inter, sans-serif;
      }
      .btn-primary {
        background-color: #3b82f6;
        color: #fff;
        border: none;
        padding: 12px 24px;
        border-radius: 50px;
        font-weight: 600;
        transition: all 0.3s ease;
      }
      .btn-primary:hover {
        background-color: #2563eb;
      }
      .btn-secondary {
        background-color: #e5e7eb;
        color: #111827;
        border: none;
        padding: 12px 24px;
        border-radius: 50px;
        font-weight: 600;
        transition: all 0.3s ease;
      }
      .btn-secondary:hover {
        background-color: #d1d5db;
      }
    </style>

    <!-- Favicons -->
    <link rel="icon" type="image/webp" sizes="192x192" href="/photo/logo.webp" />
    <link rel="shortcut icon" href="/photo/logo.webp" type="image/x-icon" />

    <!-- Scripts -->
    <link rel="stylesheet" href="/dist/output.css">
    <script src="https://www.google.com/recaptcha/api.js?render=6LczH98qAAAAACw9ZG4AoYNdYK9MOFsQQPPVDXzA"></script>
  </head>
  <body class="bg-gradient-to-br from-gray-900 to-gray-800 text-gray-100">
    <nav
      class="navbar fixed w-full top-0 z-50 bg-gray-900 py-4 px-6 flex items-center justify-between"
    >
      <div class="container mx-auto flex items-center justify-between">
        <a href="/index.html" class="text-2xl font-bold text-blue-400"
          >Assistify</a
        >
        <div>
          <a
            href="./Login.html"
            class="px-4 py-2 text-sm font-semibold btn-primary rounded-lg hover:bg-blue-600 transition-all"
            >login</a
          >
        </div>
      </div>
    </nav>
    <div
      class="flex items-center justify-center min-h-screen pt-24 px-4 bg-gray-900"
    >
      <div
        class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700 mb-12"
      >
        <h2 class="text-3xl font-bold text-center mb-6 text-blue-400">
          Create Your Account
        </h2>
        <form id="signup-form">
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-400 mb-2"
              ><i class="fas fa-user mr-2 text-blue-400"></i>First Name</label
            >
            <input
              type="text"
              id="first-name"
              class="w-full px-4 py-3 bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 border border-gray-600 placeholder-gray-400"
              placeholder="Enter your first name"
              required
            />
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-400 mb-2"
              ><i class="fas fa-user mr-2 text-blue-400"></i>Last Name</label
            >
            <input
              type="text"
              id="last-name"
              class="w-full px-4 py-3 bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 border border-gray-600 placeholder-gray-400"
              placeholder="Enter your last name"
              required
            />
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-400 mb-2"
              ><i class="fas fa-envelope mr-2 text-blue-400"></i>Email
              Address</label
            >
            <input
              type="email"
              id="email"
              class="w-full px-4 py-3 bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 border border-gray-600 placeholder-gray-400"
              placeholder="Enter your email"
              required
            />
          </div>
          <div class="mb-6 relative">
            <label class="block text-sm font-medium text-gray-400 mb-2"
              ><i class="fas fa-lock mr-2 text-blue-400"></i>Password</label
            >
            <input
              type="password"
              id="password"
              class="w-full px-4 py-3 bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 border border-gray-600 placeholder-gray-400"
              placeholder="Enter your password"
              required
            />
          </div>
          <button
            type="submit"
            class="w-full btn-primary text-white font-semibold shadow-md"
          >
            Sign Up
          </button>
        </form>
        <div class="my-6 flex items-center">
          <hr class="flex-grow border-gray-600" />
          <span class="mx-4 text-gray-400">or</span>
          <hr class="flex-grow border-gray-600" />
        </div>
        <button
          onclick="signupWithGoogle()"
          class="w-full flex items-center justify-center gap-3 px-5 py-3 bg-gray-900 text-white rounded-tl-3xl rounded-br-3xl shadow-md hover:bg-gray-800 transition"
        >
          <i class="fab fa-google text-red-500 text-lg"></i> Sign Up with Google
        </button>
        <p class="text-center mt-6 text-sm">
          Already have an account?
          <a
            href="./login.html"
            class="text-blue-400 hover:underline transition"
            >Log in here</a
          >
        </p>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.7/dist/sweetalert2.all.min.js"></script>
    <script src="/authentication/js/signup.js"></script>
    <script src="/js/main/auth.js"></script>
  </body>
</html>
