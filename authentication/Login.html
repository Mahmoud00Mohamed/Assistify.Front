    <style>
      body {
        font-family: "Inter", sans-serif;
        margin: 0;
        background: linear-gradient(to bottom right, #111827, #1f2937);
        color: #e5e7eb;
      }
      .btn-primary {
        background-color: #3b82f6;
        color: #fff;
        border: none;
        padding: 12px 24px;
        border-radius: 50px;
        font-weight: 600;
        transition: background-color 0.3s ease;
        cursor: pointer;
      }
      .btn-primary:hover {
        background-color: #2563eb;
      }
      .btn-secondary {
        background-color: #e5e7eb;
        color: #111827;
        border: none;
        padding: 12px 24px;
        border-radius: 50px;
        font-weight: 600;
        transition: background-color 0.3s ease;
        cursor: pointer;
      }
      .btn-secondary:hover {
        background-color: #d1d5db;
      }
      nav {
        padding: 1rem;
        position: fixed;
        top: 0;
        width: 100%;
        background: #111827;
        border-bottom: 1px solid #374151;
        z-index: 50;
      }
      .nav-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;
      }
      .logo {
        display: flex;
        align-items: center;
        font-size: 1.25rem;
      }
      .signup-btn {
        padding: 8px 16px;
        font-size: 0.875rem;
      }
      main {
        padding-top: 5rem; /* تعويض ارتفاع الـ nav */
        min-height: calc(100vh - 5rem); /* ضمان ملء الشاشة مع احتساب الـ nav */
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-container {
        background: #1f2937;
        padding: 2rem;
        border-radius: 1rem;
        box-shadow: 0 10px 15px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 28rem;
        border: 1px solid #374151;
      }
      h1 {
        font-size: 1.875rem;
        text-align: center;
        margin-bottom: 1.5rem;
        color: #60a5fa;
      }
      form input {
        width: 100%;
        padding: 0.75rem 1rem;
        background: #374151;
        border: 1px solid #4b5563;
        border-radius: 0.5rem;
        color: #e5e7eb;
        font-size: 1rem;
      }
      form input:focus {
        outline: none;
        border-color: #60a5fa;
        box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.3);
      }
      .google-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: #111827;
        padding: 0.75rem;
        border-radius: 1.5rem 0 1.5rem 0;
        transition: background-color 0.3s ease;
      }
      .google-btn:hover {
        background: #1f2937;
      }

      /* Responsive Design */
      @media (max-width: 640px) {
        nav {
          padding: 0.75rem;
        }
        .logo {
          font-size: 1rem;
        }
        .logo img {
          width: 24px;
          height: 24px;
        }
        .signup-btn {
          padding: 6px 12px;
          font-size: 0.75rem;
        }
        main {
          padding-top: 4rem; /* تقليل الـ padding على الهواتف */
          min-height: calc(100vh - 4rem);
          padding-left: 1rem;
          padding-right: 1rem;
        }
        .login-container {
          padding: 1.5rem;
          max-width: 100%;
        }
        h1 {
          font-size: 1.5rem;
        }
        form input {
          padding: 0.65rem;
          font-size: 0.9rem;
        }
        .google-btn {
          padding: 0.65rem;
          font-size: 0.9rem;
        }
      }
    </style>

      src="https://www.googletagmanager.com/gtag/js?id=G-GH38CDE11E"

    <script>
      window.dataLayer = window.dataLayer || [];

        dataLayer.push(arguments);

    <script
      src="https://www.google.com/recaptcha/api.js?render=6LczH98qAAAAACw9ZG4AoYNdYK9MOFsQQPPVDXzA"
      async
      defer
    ></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Login to Assistify",
        "description": "Log in to your Assistify account to manage tasks and projects efficiently.",
        "url": "https://www.assistify.site/login"
      }
    </script>
  </head>
  <body>
    <nav>
      <div class="nav-container">
        <a
          href="/index.html"
          class="logo text-white font-bold"
          aria-label="Assistify Home - Task Management Software"
        >
          <img
            src="/photo/logo.webp"
            alt="Assistify logo"
            width="32"
            height="32"
            loading="eager"
            decoding="async"
          />
          <span>ssistify</span>
          <!-- تم تصحيح "ssistify" إلى "Assistify" -->
        </a>
        <div class="flex items-center space-x-4">
          <a
            href="./signup.html"
            class="btn-primary signup-btn text-white font-medium"
            aria-label="Sign up to get started with Assistify"
            >Signup</a
          >
        </div>
      </div>
    </nav>
    <main>
      <section class="login-container">
        <h1>Welcome Back!</h1>
        <form id="login-form">
          <div class="mb-4">
            <label
              for="email"
              class="block text-sm font-medium text-gray-400 mb-2"
            >
              <i
                class="fas fa-envelope mr-2 text-blue-400"
                aria-hidden="true"
              ></i
              >Email Address
            </label>
            <input
              type="email"
              id="email"
              class="w-full"
              placeholder="Enter your email"
              required
              aria-label="Enter your email address"
            />
          </div>
          <div class="mb-6">
            <label
              for="password"
              class="block text-sm font-medium text-gray-400 mb-2"
            >
              <i class="fas fa-lock mr-2 text-blue-400" aria-hidden="true"></i
              >Password
            </label>
            <input
              type="password"
              id="password"
              class="w-full"
              placeholder="Enter your password"
              required
              aria-label="Enter your password"
            />
            <p class="text-right mt-2 text-sm">
              <a
                href="/authentication/reset-request.html"
                class="text-blue-400 hover:underline transition"
                aria-label="Reset your Assistify password"
                >Forgot password?</a
              >
            </p>
          </div>
          <button
            type="submit"
            class="w-full btn-primary text-white font-semibold shadow-md"
            aria-label="Log in to Assistify"
          >
            Login
          </button>
        </form>
        <div class="my-6 flex items-center">
          <hr class="flex-grow border-gray-600" />
          <span class="mx-4 text-gray-400">or</span>
          <hr class="flex-grow border-gray-600" />
        </div>
        <button
          onclick="signupWithGoogle()"
          class="w-full google-btn text-white font-semibold shadow-md"
          aria-label="Log in with Google"
        >
          <i
            class="fab fa-google text-[#4285F4] text-lg"
            aria-hidden="true"
          ></i>
          Login with Google
        </button>
        <p class="text-center mt-6 text-sm">
          Don’t have an account?
          <a
            href="./signup.html"
            class="text-blue-400 hover:underline transition"
            aria-label="Sign up for a new Assistify account"
            >Sign up here</a
          >
        </p>
      </section>
    </main>
    <script src="/authentication/js/Login.js" defer></script>
    <script
      src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.7/dist/sweetalert2.all.min.js"
      defer
    ></script>
    <script src="/js/main/auth.js" defer></script>
  </body>
</html>
