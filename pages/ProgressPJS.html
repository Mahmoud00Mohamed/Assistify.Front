<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character Encoding and Viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Security and Access Control -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      http-equiv="Cache-Control"
      content="no-store, no-cache, must-revalidate, max-age=0"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Core Metadata -->
    <title>Progress Tracking | Assistify</title>
    <meta
      name="description"
      content="Track your task and project progress with Assistify’s intuitive dashboard and analytics."
    />
    <meta
      name="keywords"
      content="progress tracking, task analytics, Assistify dashboard, productivity"
    />
    <meta name="author" content="Assistify" />

    <!-- Open Graph Metadata (Optional Social Media Sharing) -->
    <meta property="og:title" content="Progress Tracking | Assistify" />
    <meta
      property="og:description"
      content="Monitor your tasks and projects with Assistify’s progress tracking tools."
    />
    <meta
      property="og:image"
      content="https://www.assistify.site/photo/logo.webp"
    />
    <meta
      property="og:url"
      content="https://www.assistify.site/progress-tracking"
    />
    <meta property="og:type" content="website" />

    <!-- Favicons -->
    <link rel="shortcut icon" href="/photo/logo.webp" type="image/x-icon" />
    <link
      rel="icon"
      type="image/webp"
      sizes="192x192"
      href="/photo/logo.webp"
    />

    <!-- Stylesheets -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="/Styles/libs/fonts-googleapis.css" />
    <link rel="stylesheet" href="/Styles/main-content.css" />

    <!-- Inline Styles -->
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #060b10;
      }

      .status-pending {
        color: #fbbf24;
      }

      .status-in-progress {
        color: #3b82f6;
      }

      .status-completed {
        color: #10b981;
      }

      .status-overdue {
        color: #ef4444;
      }

      .accordion-header {
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      .accordion-header:hover {
        background-color: rgba(255, 255, 255, 0.1);
      }

      .accordion-content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
      }

      .accordion-content.open {
        max-height: 500px;
      }

      .text-accent {
        color: #34d399;
      }

      .text-sm {
        font-size: 11px;
      }

      @media (max-width: 1180px) {
        #fixed-header2 {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 70px;
          background-color: #111827;
          display: flex;
          align-items: center;
          justify-content: center;
          color: white;
          font-weight: bold;
          font-size: 1.5rem;
          z-index: 10;
        }

        #grid-up {
          margin-top: 70px;
        }

        #sidebar {
          transform: translateX(-100%);
          transition: transform 0.3s ease-in-out;
          position: fixed;
          top: 0;
          left: 0;
          height: 100%;
          box-sizing: border-box;
          overflow-y: auto;
          z-index: 100000;
        }

        #sidebar.active {
          transform: translateX(0);
        }

        #logo-Section {
          margin-left: 15%;
        }

        #menu-toggle {
          position: fixed;
          top: 2%;
          left: 20px;
          z-index: 100000;
          border: none;
          padding: 10px;
          border-radius: 50%;
          width: 40px;
          height: 40px;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: transparent;
          transition: all 0.3s ease;
          cursor: pointer;
        }

        #menu-toggle:hover {
          transform: scale(1.1);
        }

        #menu-toggle:active {
          transform: scale(0.95);
        }

        #menu-toggle i {
          color: inherit;
          font-size: 1.2rem;
          transition: color 0.3s ease;
        }

        #menu-toggle.active {
          color: #3b82f6;
        }

        #page-title {
          position: fixed;
          top: 2.3vh;
          left: 50px;
          z-index: 10000;
          font-size: 1rem !important;
        }
      }

      @media (min-width: 1180px) {
        #menu-toggle {
          display: none;
        }
      }

      @media (max-width: 767px) {
        .text-sm {
          font-size: 11px;
        }
      }
    </style>

    <!-- Scripts -->
    <link rel="stylesheet" href="/dist/output.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.7/dist/sweetalert2.all.min.js"></script>
    <script defer src="/js/main-content.js"></script>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-GH38CDE11E"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-GH38CDE11E", {
        send_page_view: true,
        page_path: window.location.pathname,
      });
    </script>
  </head>
  <body class="text-gray-100 bg-gray-900">
    <div
      id="fixed-header2"
      class="fixed top-0 left-0 w-full h-16 z-1000 flex items-center justify-center text-white font-bold text-lg hidden"
    ></div>
    <div class="flex h-screen" id="content">
      <aside
        class="fixed inset-y-0 left-0 z-50 w-64 bg-gray-900 text-gray-200 transition-transform duration-300 ease-in-out md:relative md:shadow-lg flex flex-col h-screen sidebar"
        id="sidebar"
      >
        <!-- Logo Section -->
        <div class="flex items-center px-6 py-4 border-b border-gray-800">
          <img
            src="/photo/logo.webp"
            alt="A"
            class="h-8 w-auto"
            id="logo-Section"
          />
          <span class="text-xl font-semibold text-orange-400">ssistify</span>
        </div>

        <!-- Navigation Menu -->
        <nav class="flex-1 px-3 py-4 overflow-y-auto">
          <ul class="space-y-1">
            <li>
              <a
                href="./TDL.html"
                class="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-800 hover:text-blue-400 transition-all duration-200 ease-in-out group"
              >
                <i
                  class="fas fa-tasks w-5 text-blue-400 transition-transform duration-200 group-hover:scale-110"
                ></i>
                <span class="ml-3">TDL</span>
              </a>
            </li>
            <li>
              <a
                href="./PJS.html"
                class="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-800 hover:text-blue-400 transition-all duration-200 ease-in-out group"
              >
                <i
                  class="fas fa-calendar-check w-5 text-blue-400 transition-transform duration-200 group-hover:scale-110"
                ></i>
                <span class="ml-3">PJS</span>
              </a>
            </li>
            <li>
              <a
                href="./ProgressTDL.html"
                class="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-800 hover:text-blue-400 transition-all duration-200 ease-in-out group"
              >
                <i
                  class="fas fa-chart-line w-5 text-blue-400 transition-transform duration-200 group-hover:scale-110"
                ></i>
                <span class="ml-3">Progress TDL</span>
              </a>
            </li>
            <li>
              <a
                href="./ProgressPJS.html"
                class="flex items-center px-3 py-2 text-sm font-medium rounded-md bg-gray-800 text-blue-400 transition-all duration-200 ease-in-out group"
              >
                <i
                  class="fas fa-chart-line w-5 text-blue-400 transition-transform duration-200 group-hover:scale-110"
                ></i>
                <span class="ml-3">Progress PJS</span>
              </a>
            </li>
          </ul>
        </nav>

        <!-- Bottom Section (Pinned to Bottom) -->
        <!-- Bottom Section (Pinned to Bottom) -->
        <div class="mt-auto px-3 py-4 border-t border-gray-800">
          <ul class="space-y-2">
            <li>
              <a
                href="./account.html"
                class="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-800 hover:text-blue-400 transition-all duration-200 ease-in-out group"
              >
                <i
                  class="fas fa-user-circle w-5 text-blue-400 transition-transform duration-200 group-hover:scale-110"
                ></i>
                <span class="ml-3">Profile</span>
              </a>
            </li>
            <li>
              <a
                class="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-800 hover:text-blue-400 transition-all duration-200 ease-in-out group"
                id="logout-btn"
              >
                <i
                  class="fas fa-sign-out-alt w-5 text-blue-400 transition-transform duration-200 group-hover:scale-110"
                ></i>
                <span class="ml-3">Logout</span>
              </a>
            </li>
          </ul>
        </div>
      </aside>
      <main class="flex-1 p-8 overflow-y-auto">
        <div class="flex justify-between items-center mb-8">
          <div class="flex items-center">
            <button id="menu-toggle" class="lg:hidden text-gray-100">
              <i class="fa-solid fa-bars-staggered"></i>
            </button>
            <h1 class="text-2xl font-bold ml-4" id="page-title">
              <i class="fa-solid fa-chart-line" style="color: #ffd43b"></i>
              𝙋𝙧𝙤𝙜𝙧𝙚𝙨𝙨 𝙏𝙧𝙖𝙘𝙠𝙞𝙣𝙜
            </h1>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8" id="grid-up">
          <div class="bg-gray-800 p-6 rounded-lg">
            <h3 class="text-lg font-bold mb-2">Total Projects</h3>
            <p class="text-3xl font-bold text-accent" id="total-projects">0</p>
          </div>
          <div class="bg-gray-800 p-6 rounded-lg">
            <h3 class="text-lg font-bold mb-2">Completed Tasks</h3>
            <p class="text-3xl font-bold text-green-500" id="completed-tasks">
              0
            </p>
          </div>
          <div class="bg-gray-800 p-6 rounded-lg">
            <h3 class="text-lg font-bold mb-2">Overdue Tasks</h3>
            <p class="text-3xl font-bold text-red-500" id="overdue-tasks">0</p>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
          <div class="bg-gray-800 p-6 rounded-lg">
            <h3 class="text-lg font-bold mb-4">Project Progress</h3>
            <canvas id="progressChart"></canvas>
          </div>
          <div class="bg-gray-800 p-6 rounded-lg">
            <h3 class="text-lg font-bold mb-4">Task Status Distribution</h3>
            <canvas id="taskStatusChart"></canvas>
          </div>
        </div>
        <div class="bg-gray-800 p-6 rounded-lg">
          <h3 class="text-lg font-bold mb-4">Tasks Details</h3>
          <div id="projects-accordion"></div>
        </div>
        <div class="h-20"></div>
      </main>
    </div>

    <script src="/js/showAlert.js"></script>
    <script src="/js/ProgressPJS.js"></script>
    <script src="/js/toggle.js"></script>
    <script src="/js/main/auth.js"></script>
    <script src="/js/main/api.js"></script>
    <script src="/js/main/authEvents.js"></script>
    <script src="/js/main/logoutButton.js"></script>
  </body>
</html>
