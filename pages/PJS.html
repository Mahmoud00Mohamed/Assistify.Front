    <!-- Scripts -->
    <link rel="stylesheet" href="/dist/output.css" />

  <body class="text-gray-100">
    <div
      id="fixed-header"
      class="fixed top-0 left-0 w-full h-16 z-1000 flex items-center justify-center text-white font-bold text-lg hidden"
    ></div>
    <div class="flex h-screen" id="content">
      <aside
        class="fixed inset-y-0 left-0 z-50 w-64 bg-gray-900 text-gray-200 transition-transform duration-300 ease-in-out md:relative md:shadow-lg flex flex-col h-screen sidebar"
        id="sidebar"
      >
        <!-- Logo Section -->
        <div class="flex items-center px-6 py-4 border-b border-gray-800">
          <img
            src="/photo/logo.webp"
            alt="A"
            class="h-8 w-auto"
            id="logo-Section"
          />
          <span class="text-xl font-semibold text-orange-400">ssistify</span>
        </div>

        <!-- Navigation Menu -->
        <nav class="flex-1 px-3 py-4 overflow-y-auto">
          <ul class="space-y-1">
            <li>
              <a
                href="./TDL.html"
                class="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-800 hover:text-blue-400 transition-all duration-200 ease-in-out group"
              >
                <i
                  class="fas fa-tasks w-5 text-blue-400 transition-transform duration-200 group-hover:scale-110"
                ></i>
                <span class="ml-3">TDL</span>
              </a>
            </li>
            <li>
              <a
                href="./PJS.html"
                class="flex items-center px-3 py-2 text-sm font-medium rounded-md bg-gray-800 text-blue-400 transition-all duration-200 ease-in-out group"
              >
                <i
                  class="fas fa-calendar-check w-5 text-blue-400 transition-transform duration-200 group-hover:scale-110"
                ></i>
                <span class="ml-3">PJS</span>
              </a>
            </li>
            <li>
              <a
                href="./ProgressTDL.html"
                class="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-800 hover:text-blue-400 transition-all duration-200 ease-in-out group"
              >
                <i
                  class="fas fa-chart-line w-5 text-blue-400 transition-transform duration-200 group-hover:scale-110"
                ></i>
                <span class="ml-3">Progress TDL</span>
              </a>
            </li>
            <li>
              <a
                href="./ProgressPJS.html"
                class="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-800 hover:text-blue-400 transition-all duration-200 ease-in-out group"
              >
                <i
                  class="fas fa-chart-line w-5 text-blue-400 transition-transform duration-200 group-hover:scale-110"
                ></i>
                <span class="ml-3">Progress PJS</span>
              </a>
            </li>
          </ul>
        </nav>

        <!-- Bottom Section (Pinned to Bottom) -->
        <!-- Bottom Section (Pinned to Bottom) -->
        <div class="mt-auto px-3 py-4 border-t border-gray-800">
          <ul class="space-y-2">
            <li>
              <a
                href="./account.html"
                class="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-800 hover:text-blue-400 transition-all duration-200 ease-in-out group"
              >
                <i
                  class="fas fa-user-circle w-5 text-blue-400 transition-transform duration-200 group-hover:scale-110"
                ></i>
                <span class="ml-3">Profile</span>
              </a>
            </li>
            <li>
              <a
                class="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-800 hover:text-blue-400 transition-all duration-200 ease-in-out group"
                id="logout-btn"
              >
                <i
                  class="fas fa-sign-out-alt w-5 text-blue-400 transition-transform duration-200 group-hover:scale-110"
                ></i>
                <span class="ml-3">Logout</span>
              </a>
            </li>
          </ul>
        </div>
      </aside>
      <main class="flex-1 p-8 overflow-y-auto">
        <div
          id="loading-spinner"
          class="fixed inset-0 flex items-center justify-center bg-gray-900/50 backdrop-blur-sm hidden"
        >
          <div
            class="w-12 h-12 border-4 border-gray-700 border-t-blue-600 rounded-full animate-spin relative"
          >
            <div
              class="absolute inset-0 border-2 border-transparent border-t-accent rounded-full animate-spin-slow"
            ></div>
          </div>
        </div>
        <div class="flex justify-between items-center mb-8">
          <button id="menu-toggle" class="lg:hidden text-gray-100">
            <i class="fa-solid fa-bars-staggered"></i>
          </button>
          <h1 class="text-2xl font-bold ml-4" id="page-title">
            <i class="fa-solid fa-calendar-days" style="color: #ffd43b"></i>
            𝒫𝓇𝑜𝒿𝑒𝒸𝓉 𝒮𝒸𝒽𝑒𝒹𝓊𝓁𝑒
          </h1>
          <div class="flex items-center space-x-4" id="search-filter">
            <input
              type="text"
              id="search-input"
              placeholder="Search tasks..."
              class="px-4 py-2 rounded-lg bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-accent"
            />
            <select
              id="filter-importance"
              class="px-4 py-2 bg-gray-700 rounded-lg focus:outline-none"
            >
              <option value="all">All Statuses</option>
              <option value="completed">Completed</option>
              <option value="pending">Pending</option>
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
              <option value="cancelled">Cancelled</option>
              <option value="not-started">Not Started</option>
              <option value="in-progress">In Progress</option>
              <option value="partially-completed">Partially Completed</option>
              <option value="on-hold">On Hold</option>
            </select>
            <button
              id="new-project-btn"
              class="btn-primary px-4 py-2 rounded-lg shadow-lg hover:bg-blue-600 transition text-sm"
            >
              <i class="fas fa-plus mr-2"></i> New Project
            </button>
          </div>
        </div>
        <div id="project-list" class="space-y-4"></div>
        <div
          class="flex justify-center items-center h-[60vh] xl:h-[80vh] hidden"
          id="no-tasks"
        >
          <img
            src="/photo/undraw_online.webp"
            alt="No project added yet"
            class="max-w-xs"
          />
        </div>
        <div class="h-20"></div>
      </main>
    </div>
    <div
      id="project-modal"
      class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center"
    >
      <div class="bg-gray-800 p-6 rounded-lg w-96">
        <h2 class="text-xl font-bold mb-4" id="modal-title">Add New Project</h2>
        <form id="project-form">
          <input type="hidden" id="project-id" />
          <div class="mb-4">
            <label class="block text-sm font-medium mb-2">Project Name</label>
            <input
              type="text"
              id="project-name"
              class="w-full px-4 py-2 bg-gray-700 rounded-lg focus:outline-none"
              required
            />
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium mb-2"
              >Project Description</label
            >
            <textarea
              id="project-description"
              class="w-full px-4 py-2 bg-gray-700 rounded-lg focus:outline-none"
            ></textarea>
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium mb-2">Start Date</label>
            <input
              type="date"
              id="project-start-date"
              class="w-full px-4 py-2 bg-gray-700 rounded-lg focus:outline-none"
              required
            />
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium mb-2">End Date</label>
            <input
              type="date"
              id="project-end-date"
              class="w-full px-4 py-2 bg-gray-700 rounded-lg focus:outline-none"
              required
            />
          </div>
          <div class="mb-4 hidden">
            <label class="block text-sm font-medium mb-2">Status</label>
            <select
              id="project-status"
              class="w-full px-4 py-2 bg-gray-700 rounded-lg focus:outline-none"
            >
              <option value="pending">Pending</option>
              <option value="in-progress">In Progress</option>
              <option value="completed">Completed</option>
              <option value="on-hold">On Hold</option>
              <option value="cancelled">Cancelled</option>
              <option value="not-started">Not Started</option>
            </select>
          </div>
          <div class="flex justify-end space-x-3">
            <button
              type="button"
              id="cancel-btn"
              class="px-4 py-2 bg-gray-600 rounded-lg hover:bg-gray-700 text-sm"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="px-4 py-2 bg-accent rounded-lg hover:bg-green-500 text-sm"
            >
              Save
            </button>
          </div>
        </form>
      </div>
    </div>
    <div
      id="task-modal"
      class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center"
    >
      <div class="bg-gray-800 p-6 rounded-lg w-96">
        <h2 class="text-xl font-bold mb-4" id="task-modal-title">
          Add New Task
        </h2>
        <form id="task-form">
          <input type="hidden" id="task-id" />
          <div class="mb-4">
            <label class="block text-sm font-medium mb-2">Task Name</label>
            <input
              type="text"
              id="task-name"
              class="w-full px-4 py-2 bg-gray-700 rounded-lg focus:outline-none"
              required
            />
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium mb-2"
              >Task Description</label
            >
            <textarea
              id="task-description"
              class="w-full px-4 py-2 bg-gray-700 rounded-lg focus:outline-none"
            ></textarea>
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium mb-2">Assigned To</label>
            <input
              type="text"
              id="task-assigned"
              class="w-full px-4 py-2 bg-gray-700 rounded-lg focus:outline-none"
              required
            />
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium mb-2">Start Date</label>
            <input
              type="date"
              id="task-start-date"
              class="w-full px-4 py-2 bg-gray-700 rounded-lg focus:outline-none"
              required
            />
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium mb-2">End Date</label>
            <input
              type="date"
              id="task-end-date"
              class="w-full px-4 py-2 bg-gray-700 rounded-lg focus:outline-none"
              required
            />
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium mb-2">Status</label>
            <select
              id="task-status"
              class="w-full px-4 py-2 bg-gray-700 rounded-lg focus:outline-none"
            >
              <option value="pending">Pending</option>
              <option value="in-progress">In Progress</option>
              <option value="completed">Completed</option>
              <option value="on-hold">On Hold</option>
              <option value="cancelled">Cancelled</option>
              <option value="not-started">Not Started</option>
            </select>
          </div>
          <div class="flex justify-end space-x-3">
            <button
              type="button"
              id="task-cancel-btn"
              class="px-4 py-2 bg-gray-600 rounded-lg hover:bg-gray-700 text-sm"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="px-4 py-2 bg-accent rounded-lg hover:bg-green-500 text-sm"
            >
              Save
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="/js/toggle.js"></script>

    <script src="/js/main/api.js"></script>
    <script src="/js/PJS.js"></script>
    <script src="/js/main/sync.js"></script>
    <script src="/js/main/authEvents.js"></script>
    <script src="/js/main/logoutButton.js"></script>
  </body>
</html>
