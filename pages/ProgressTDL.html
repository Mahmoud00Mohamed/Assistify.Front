<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      http-equiv="Cache-Control"
      content="no-store, no-cache, must-revalidate, max-age=0"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="shortcut icon" href="/photo/logo.png" type="image/x-icon" />
    <title>Progress Tracking</title>
    <script src="/js/libs/tailwindcss.js"></script>
    <link rel="stylesheet" href="/Styles/libs/fonts-googleapis.css" />
    <link rel="stylesheet" href="../Styles/main-content.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script defer="defer" src="/js/main-content.js"></script>
    <script src="/js/libs/chart.js"></script>
    <script src="/js/libs/sweetalert2.js"></script>
    <style>
      .sidebar {
        background-color: #1f2937;
      }
      .task-card {
        background-color: #374151;
        transition: transform 0.2s ease-in-out;
      }
      .task-card:hover {
        transform: translateY(-5px);
      }
      .status-pending {
        color: #fbbf24;
      }
      .status-in-progress {
        color: #3b82f6;
      }
      .status-completed {
        color: #10b981;
      }
      .status-overdue {
        color: #ef4444;
      }
      .progress-bar {
        background-color: #3b82f6;
        height: 100%;
        border-radius: 9999px;
      }
    </style>
  </head>
  <body class="text-gray-100 bg-gray-900">
    <div class="flex h-screen" id="content">
      <aside
        class="fixed inset-y-0 left-0 z-50 w-64 bg-gray-900 text-gray-200 transition-transform duration-300 ease-in-out md:relative md:shadow-lg flex flex-col h-screen sidebar"
        id="sidebar"
      >
        <!-- Logo Section -->
        <div class="flex items-center px-6 py-4 border-b border-gray-800">
          <img
            src="/photo/logo.png"
            alt="A"
            class="h-8 w-auto"
            id="logo-Section"
          />
          <span class="text-xl font-semibold text-orange-400">ssistify</span>
        </div>

        <!-- Navigation Menu -->
        <nav class="flex-1 px-3 py-4 overflow-y-auto">
          <ul class="space-y-1">
            <li>
              <a
                href="./TDL.html"
                class="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-800 hover:text-blue-400 transition-all duration-200 ease-in-out group"
              >
                <i
                  class="fas fa-tasks w-5 text-blue-400 transition-transform duration-200 group-hover:scale-110"
                ></i>
                <span class="ml-3">TDL</span>
              </a>
            </li>
            <li>
              <a
                href="./PJS.html"
                class="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-800 hover:text-blue-400 transition-all duration-200 ease-in-out group"
              >
                <i
                  class="fas fa-calendar-check w-5 text-blue-400 transition-transform duration-200 group-hover:scale-110"
                ></i>
                <span class="ml-3">PJS</span>
              </a>
            </li>
            <li>
              <a
                href="./ProgressTDL.html"
                class="flex items-center px-3 py-2 text-sm font-medium rounded-md bg-gray-800 text-blue-400 transition-all duration-200 ease-in-out group"
              >
                <i
                  class="fas fa-chart-line w-5 text-blue-400 transition-transform duration-200 group-hover:scale-110"
                ></i>
                <span class="ml-3">Progress TDL</span>
              </a>
            </li>
            <li>
              <a
                href="./ProgressPJS.html"
                class="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-800 hover:text-blue-400 transition-all duration-200 ease-in-out group"
              >
                <i
                  class="fas fa-chart-line w-5 text-blue-400 transition-transform duration-200 group-hover:scale-110"
                ></i>
                <span class="ml-3">Progress PJS</span>
              </a>
            </li>
          </ul>
        </nav>

        <!-- Bottom Section (Pinned to Bottom) -->
        <!-- Bottom Section (Pinned to Bottom) -->
        <div class="mt-auto px-3 py-4 border-t border-gray-800">
          <ul class="space-y-2">
            <li>
              <a
                href="./account.html"
                class="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-800 hover:text-blue-400 transition-all duration-200 ease-in-out group"
              >
                <i
                  class="fas fa-user-circle w-5 text-blue-400 transition-transform duration-200 group-hover:scale-110"
                ></i>
                <span class="ml-3">Profile</span>
              </a>
            </li>
            <li>
              <a
                class="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-gray-800 hover:text-blue-400 transition-all duration-200 ease-in-out group"
                id="logout-btn"
              >
                <i
                  class="fas fa-sign-out-alt w-5 text-blue-400 transition-transform duration-200 group-hover:scale-110"
                ></i>
                <span class="ml-3">Logout</span>
              </a>
            </li>
          </ul>
        </div>
      </aside>
      <main class="flex-1 p-8 overflow-y-auto">
        <div class="flex justify-between items-center mb-8">
          <div class="flex items-center">
            <button id="menu-toggle" class="lg:hidden text-gray-100">
              <i class="fa-solid fa-bars-staggered"></i>
            </button>
            <h1 class="text-2xl font-bold ml-4" id="page-title">
              <i class="fa-solid fa-chart-line" style="color: #ffd43b"></i>
              𝙋𝙧𝙤𝙜𝙧𝙚𝙨𝙨 𝙏𝙧𝙖𝙘𝙠𝙞𝙣𝙜
            </h1>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
          <div class="bg-gray-800 p-6 rounded-lg">
            <h3 class="text-lg font-semibold mb-2">Total Tasks</h3>
            <p class="text-3xl font-bold" id="total-tasks">0</p>
          </div>
          <div class="bg-gray-800 p-6 rounded-lg">
            <h3 class="text-lg font-semibold mb-2">Completed Tasks</h3>
            <p class="text-3xl font-bold text-green-500" id="completed-tasks">
              0
            </p>
          </div>
          <div class="bg-gray-800 p-6 rounded-lg">
            <h3 class="text-lg font-semibold mb-2">Pending Tasks</h3>
            <p class="text-3xl font-bold text-yellow-500" id="pending-tasks">
              0
            </p>
          </div>
          <div class="bg-gray-800 p-6 rounded-lg">
            <h3 class="text-lg font-semibold mb-2">Overdue Tasks</h3>
            <p class="text-3xl font-bold text-red-500" id="overdue-tasks">0</p>
          </div>
        </div>
        <div class="bg-gray-800 p-6 rounded-lg mb-8">
          <h2 class="text-xl font-bold mb-4">Task Progress Over Time</h2>
          <canvas id="progressChart"></canvas>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
          <div class="bg-gray-800 p-6 rounded-lg">
            <h2 class="text-xl font-bold mb-4">Task Completion</h2>
            <canvas id="completionChart"></canvas>
          </div>
          <div class="bg-gray-800 p-6 rounded-lg">
            <h2 class="text-xl font-bold mb-4">Tasks by Priority Chart</h2>
            <canvas id="priorityChart"></canvas>
          </div>
        </div>
      </main>
    </div>
    <head>
      <link rel="stylesheet" href="../Styles/Task.css" />
    </head>
    <script src="/js/showAlert.js"></script>
    <script src="/js/ProgressTDL.js"></script>
    <script src="/js/toggle.js"></script>
    <script src="/js/main/auth.js"></script>
    <script src="/js/main/api.js"></script>
    <script src="/js/main/authEvents.js"></script>
    <script src="/js/main/logoutButton.js"></script>
  </body>
</html>
